services:
  postgres:
    image: postgres:16-alpine
    container_name: trade_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-india_trade}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trade} -d ${POSTGRES_DB:-india_trade}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: trade_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-india_trade}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-at-least-32-chars}
      JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS:-}
      ACCESS_TOKEN_TTL_MIN: ${ACCESS_TOKEN_TTL_MIN:-60}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@india-trade.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
      EXCHANGERATE_API_KEY: ${EXCHANGERATE_API_KEY:-}
      COMTRADE_API_KEY: ${COMTRADE_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DGCIS_MODE: ${DGCIS_MODE:-incremental}
      # DGFT eBRC API credentials
      DGFT_IEC_CODE: ${DGFT_IEC_CODE:-AXGPK0287Q}
      DGFT_CLIENT_ID: ${DGFT_CLIENT_ID:-}
      DGFT_CLIENT_SECRET: ${DGFT_CLIENT_SECRET:-}
      DGFT_X_API_KEY: ${DGFT_X_API_KEY:-}
      DGFT_PRIVATE_KEY: ${DGFT_PRIVATE_KEY:-}
      DGFT_PUBLIC_KEY: ${DGFT_PUBLIC_KEY:-}
    volumes:
      - ./data:/app/data
      - ./backend/app/data:/app/app/data
    ports:
      - "8001:8000"
    command: >
      sh -c "
        echo '> Running database migrations…' &&
        alembic upgrade head &&
        echo '> Starting API server…' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: trade_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8001/api/v1}
    ports:
      - "3000:3000"

volumes:
  pgdata:
